<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>KenSuya | Coming Soon</title>
<meta name="description" content="KenSuya, Birmingham's suya specialists. Our site is being refreshed and will be back online soon." />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#241608" />
<link rel="icon" type="image/jpeg" sizes="64x64" href="assets/images/favicon-64.jpg" />
<link rel="apple-touch-icon" sizes="180x180" href="assets/images/favicon-180.jpg" />

<link rel="preload" href="assets/fonts/baloo2-variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="assets/fonts/nunitosans-variable.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face {
    font-family: 'Baloo 2';
    src: url('assets/fonts/baloo2-variable.woff2') format('woff2-variations'), url('assets/fonts/baloo2-variable.woff2') format('woff2');
    font-weight: 400 800;
    font-display: swap;
  }
  @font-face {
    font-family: 'Nunito Sans';
    src: url('assets/fonts/nunitosans-variable.woff2') format('woff2-variations'), url('assets/fonts/nunitosans-variable.woff2') format('woff2');
    font-weight: 300 900;
    font-display: swap;
  }

  :root {
    --ink: #1a0f06;
    --cream: #fffcf6;
    --gold: #f5b700;
    --red: #ce1126;
    --green: #1b8a3d;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background:
      radial-gradient(circle at 20% 15%, rgba(245,183,0,0.14), transparent 55%),
      radial-gradient(circle at 85% 80%, rgba(206,17,38,0.18), transparent 55%),
      var(--ink);
    color: var(--cream);
    font-family: 'Nunito Sans', -apple-system, sans-serif;
    text-align: center;
  }

  .wrap { max-width: 520px; }

  .badge {
    width: 128px;
    height: auto;
    margin-bottom: 1.75rem;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 1rem;
  }

  .eyebrow .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--red);
    box-shadow: 0 0 0 4px rgba(206,17,38,0.25);
  }

  h1 {
    font-family: 'Baloo 2', sans-serif;
    text-transform: uppercase;
    font-size: clamp(2.1rem, 7vw, 3.4rem);
    line-height: 1.05;
    margin: 0 0 1.1rem;
  }

  h1 .accent { color: var(--gold); }

  p.lede {
    font-size: 1rem;
    line-height: 1.7;
    color: rgba(255,252,246,0.78);
    margin: 0 auto 2.25rem;
    max-width: 420px;
  }

  .actions {
    display: flex;
    gap: 0.85rem;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 1.75rem;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.85rem 1.5rem;
    border-radius: 100px;
    font-weight: 800;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    text-decoration: none;
    transition: transform 0.2s ease, background 0.2s ease;
  }

  .btn-primary { background: var(--green); color: var(--cream); }
  .btn-primary:hover { background: #146b30; transform: translateY(-2px); }

  .btn-outline {
    background: transparent;
    color: var(--cream);
    border: 1px solid rgba(255,252,246,0.35);
  }
  .btn-outline:hover { border-color: var(--gold); color: var(--gold); transform: translateY(-2px); }

  .tagline {
    font-size: 0.78rem;
    color: rgba(255,252,246,0.5);
  }
</style>
</head>
<body>

  <div class="wrap">
    <img src="assets/images/ken-suya-badge.webp?v=2" alt="KenSuya" class="badge" />

    <span class="eyebrow"><span class="dot"></span> Birmingham's Suya Specialists</span>

    <h1>Something's <span class="accent">On The Grill.</span></h1>

    <p class="lede">We're refreshing the KenSuya site. In the meantime, message us directly and we'll sort your order the old-fashioned way.</p>

    <div class="actions">
      <a href="https://wa.me/447863337662?text=Hi%21%20I%27d%20like%20to%20place%20an%20order%20please." target="_blank" rel="noopener noreferrer" class="btn btn-primary">WhatsApp Us</a>
      <a href="https://instagram.com/KenSuya" target="_blank" rel="noopener noreferrer" class="btn btn-outline">@KenSuya</a>
    </div>

    <p class="tagline">Cow-towing to your tastes.</p>
  </div>

</body>
</html>
